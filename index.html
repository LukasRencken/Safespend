
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Safespend · Local-First</title>
<style>
  :root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-soft: #e0e7ff;
    --danger: #ef4444;
    --danger-soft: #fee2e2;
    --success: #10b981;
    --warning: #f59e0b;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --radius: 1rem;
  }
  
  [data-theme="dark"] {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #334155;
    --border: #475569;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --primary: #6366f1;
    --primary-hover: #818cf8;
    --primary-soft: #312e81;
    --danger: #f87171;
    --danger-soft: #7f1d1d;
    --success: #34d399;
    --warning: #fbbf24;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
  }

  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  
  body {
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    padding: 1rem;
    display: flex;
    justify-content: center;
    transition: background 0.3s, color 0.3s;
  }

  .app {
    max-width: 800px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  /* Typography & Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0;
  }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 0.5rem; }
  .badge { font-size: 0.65rem; background: var(--primary-soft); color: var(--primary); padding: 0.2rem 0.6rem; border-radius: 99px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  
  /* Buttons */
  .btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 0.6rem 1rem; border-radius: 0.75rem; font-weight: 600; font-size: 0.875rem;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    transition: all 0.2s; box-shadow: var(--shadow-sm);
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-icon { padding: 0.6rem; border-radius: 50%; border: none; background: var(--surface); box-shadow: var(--shadow-sm); aspect-ratio: 1; }
  .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.75rem; border-radius: 0.5rem; }
  .btn-danger { color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }
  
  /* Action Grid */
  .action-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0.5rem;
  }

  /* Stats Panel */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    background: var(--surface);
    padding: 1.25rem;
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
  }
  .stat-box { display: flex; flex-direction: column; gap: 0.25rem; }
  .stat-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
  
  /* Controls & Filters */
  .controls { display: flex; flex-direction: column; gap: 0.75rem; background: var(--surface); padding: 1rem; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
  .filter-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .input-group { flex: 1; min-width: 140px; display: flex; flex-direction: column; gap: 0.25rem; }
  
  input, select {
    width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem;
    background: var(--surface-2); color: var(--text); font-size: 0.875rem; font-weight: 500;
    outline: none; transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: var(--primary); }
  
  /* Table */
  .table-wrapper {
    background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
    box-shadow: var(--shadow-md); overflow: hidden; display: flex; flex-direction: column;
  }
  .table-scroll { overflow-x: auto; max-height: 400px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; white-space: nowrap; }
  th {
    position: sticky; top: 0; background: var(--surface-2); z-index: 10;
    text-align: left; padding: 0.75rem; font-size: 0.7rem; font-weight: 700;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  td { padding: 0.75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface-2); }
  
  .cat-badge { background: var(--primary-soft); color: var(--primary); padding: 0.2rem 0.5rem; border-radius: 0.4rem; font-size: 0.7rem; font-weight: 700; }
  .amount { font-weight: 700; font-variant-numeric: tabular-nums; }
  .amount.positive { color: var(--success); }
  .amount.negative { color: var(--danger); }
  
  /* Modals */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 1rem;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 450px;
    padding: 1.5rem; box-shadow: var(--shadow-lg); border: 1px solid var(--border);
    max-height: 90vh; overflow-y: auto;
  }
  .modal h2 { margin: 0 0 1rem 0; font-size: 1.25rem; font-weight: 800; }
  .form-row { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
  .form-row label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
  .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
  
  /* Utility */
  .hidden { display: none !important; }
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-weight: 500; }
  .empty-state .big { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
  
  /* Toast */
  .toast-container { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 0.5rem; width: 90%; max-width: 350px; }
  .toast { background: var(--text); color: var(--bg); padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 600; text-align: center; box-shadow: var(--shadow-lg); animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>💸 Safespend <span class="badge">Local</span></h1>
    <div style="display:flex; gap:0.5rem;">
      <button class="btn-icon" id="themeToggle">🌙</button>
      <button class="btn-icon" id="undoBtn" disabled>↶</button>
      <button class="btn-icon" id="redoBtn" disabled>↷</button>
    </div>
  </header>

  <!-- Main Actions -->
  <div class="action-grid">
    <button class="btn btn-primary" id="addBtn">➕ Add</button>
    <label for="csvFileInput" class="btn">⬆ Import</label>
    <input type="file" id="csvFileInput" accept=".csv" style="display:none">
    <button class="btn" id="exportBtn">⬇ Export</button>
    <button class="btn" id="loadSampleBtn">🧪 Sample</button>
    <button class="btn btn-danger" id="clearAllBtn">🗑 Clear</button>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-box">
      <span class="stat-label">Total Expenses</span>
      <span class="stat-value" id="totalAmount">R 0.00</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">This Month</span>
      <span class="stat-value" id="thisMonth">R 0.00</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Transactions</span>
      <span class="stat-value" id="totalCount" style="font-size: 1.1rem;">0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Selected</span>
      <span class="stat-value" id="selectedCount" style="font-size: 1.1rem;">0</span>
    </div>
  </div>

  <!-- Bulk Actions (only show if selected) -->
  <div id="bulkBar" class="hidden" style="display:flex; gap:0.5rem;">
    <button class="btn btn-sm btn-danger" id="bulkDeleteBtn">Delete Selected</button>
    <button class="btn btn-sm" id="bulkCategoryBtn">Change Category</button>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="filter-row">
      <div class="input-group">
        <input type="text" id="searchInput" placeholder="🔍 Search descriptions...">
      </div>
      <div class="input-group" style="flex: 0 0 130px;">
        <select id="currencySelect" title="Currency">
          <option value="USD">USD ($)</option>
          <option value="ZAR" selected>ZAR (R)</option>
          <option value="EUR">EUR (€)</option>
          <option value="GBP">GBP (£)</option>
          <option value="AUD">AUD ($)</option>
          <option value="CAD">CAD ($)</option>
          <option value="JPY">JPY (¥)</option>
        </select>
      </div>
    </div>
    <div class="filter-row">
      <div class="input-group">
        <select id="categoryFilter"><option value="">All Categories</option></select>
      </div>
      <div class="input-group">
        <input type="date" id="dateFrom" title="From Date">
      </div>
      <div class="input-group">
        <input type="date" id="dateTo" title="To Date">
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <div class="table-scroll">
      <table id="expenseTable">
        <thead>
          <tr>
            <th style="width: 30px;"><input type="checkbox" id="selectAllCheckbox" style="width:auto; padding:0;"></th>
            <th data-sort="date">Date ▼</th>
            <th data-sort="description">Description</th>
            <th data-sort="category">Category</th>
            <th data-sort="amount" style="text-align:right;">Amount</th>
            <th style="width: 40px;"></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="emptyMessage" class="empty-state hidden">
        <div class="big">📭</div>
        <div>No expenses yet.</div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-backdrop" id="expenseModal">
  <div class="modal">
    <h2 id="expenseModalTitle">Add Expense</h2>
    <div class="form-row">
      <label>Amount</label>
      <input type="number" id="modalAmount" step="0.01" placeholder="0.00" style="font-size: 1.25rem; font-weight: 700;">
    </div>
    <div class="form-row">
      <label>Description</label>
      <input type="text" id="modalDescription" placeholder="e.g. Groceries">
    </div>
    <div class="form-row">
      <label>Category</label>
      <input type="text" id="modalCategory" list="categoryOptions" placeholder="e.g. Food">
      <datalist id="categoryOptions"></datalist>
    </div>
    <div class="form-row">
      <label>Date</label>
      <input type="date" id="modalDate">
    </div>
    <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:1rem;">
      <input type="checkbox" id="modalRecurring" style="width:auto;">
      <label for="modalRecurring" style="font-size:0.875rem; font-weight:600; color:var(--text);">Recurring monthly</label>
    </div>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSave">Save</button>
    </div>
  </div>
</div>

<!-- Bulk Category Modal -->
<div class="modal-backdrop" id="bulkCategoryModal">
  <div class="modal">
    <h2>Change Category</h2>
    <div class="form-row">
      <label>New Category</label>
      <input type="text" id="bulkCategoryInput" list="categoryOptions" placeholder="e.g. Food">
    </div>
    <div class="modal-actions">
      <button class="btn" id="bulkCategoryCancel">Cancel</button>
      <button class="btn btn-primary" id="bulkCategorySave">Apply</button>
    </div>
  </div>
</div>

<!-- Import Modal -->
<div class="modal-backdrop" id="importModal">
  <div class="modal">
    <h2>Import Data</h2>
    <div id="importSummary" style="font-size:0.875rem; margin-bottom:1rem;"></div>
    <div style="display:flex; flex-direction:column; gap:0.5rem; margin-bottom:1rem;">
      <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.875rem;">
        <input type="radio" name="importMode" value="append" checked> Append to existing
      </label>
      <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.875rem;">
        <input type="radio" name="importMode" value="replace"> Replace everything
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn" id="importCancel">Cancel</button>
      <button class="btn btn-primary" id="importConfirm">Import</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
(function(){
  'use strict';
  
  // === Constants ===
  const STORAGE_KEY = 'safespend_v4';
  const THEME_KEY = 'safespend_theme';
  const CURRENCY_KEY = 'safespend_currency';
  
  // === State ===
  let expenses = [];
  let currency = 'ZAR';
  let selectedIds = new Set();
  let sortKey = 'date';
  let sortDir = 'desc';
  let editingId = null;
  let pendingImport = [];
  
  // === DOM ===
  const $ = s => document.querySelector(s);
  const tbody = $('#tableBody');
  
  // === Utilities ===
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const todayISO = () => new Date().toISOString().slice(0,10);
  const escapeHtml = t => String(t||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  
  function isValidDate(s) {
    if (!s || typeof s !== 'string') return false;
    const m = s.trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return false;
    const dt = new Date(+m[1], +m[2]-1, +m[3]);
    return dt.getFullYear()===+m[1] && dt.getMonth()===+m[2]-1 && dt.getDate()===+m[3];
  }

  function formatCurrency(n) {
    return new Intl.NumberFormat('en-ZA', { style: 'currency', currency: currency }).format(n);
  }
  
  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    $('#toastContainer').appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2500);
  }

  // === Storage ===
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
      localStorage.setItem(CURRENCY_KEY, currency);
    } catch(e) { toast('Storage full'); }
  }

  function load() {
    try {
      const d = localStorage.getItem(STORAGE_KEY);
      if (d) expenses = JSON.parse(d).filter(e => e && isValidDate(e.date) && !isNaN(e.amount));
      
      const c = localStorage.getItem(CURRENCY_KEY);
      if (c) currency = c;
    } catch(e) {}
  }

  // === CSV Parsing ===
  function parseCSV(text) {
    if (!text) return [];
    const rows = [];
    let cur = '', row = [], q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else {
        if (c === '"') q = true;
        else if (c === ',' || c === ';') { row.push(cur); cur = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i+1] === '\n') i++;
          row.push(cur); cur = '';
          if (row.length > 1 || row[0].trim()) rows.push(row);
          row = [];
        } else cur += c;
      }
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    if (rows.length < 2) return [];

    const out = [];
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (r.length < 4) continue;
      const date = r[0].trim(), desc = r[1].trim(), cat = r[2].trim() || 'Other';
      let amtStr = r[3].replace(/[^\d.,\-]/g, '').replace(/,/g, '.');
      const amount = parseFloat(amtStr);
      if (isValidDate(date) && !isNaN(amount)) {
        out.push({ id: uid(), date, description: desc || '—', category: cat, amount });
      }
    }
    return out;
  }

  // === Render ===
  function render() {
    // Filter
    const q = $('#searchInput').value.toLowerCase();
    const cat = $('#categoryFilter').value;
    const f = $('#dateFrom').value;
    const t = $('#dateTo').value;
    
    let filtered = expenses.filter(e => {
      if (q && !(e.description.toLowerCase().includes(q) || e.category.toLowerCase().includes(q))) return false;
      if (cat && e.category !== cat) return false;
      if (f && e.date < f) return false;
      if (t && e.date > t) return false;
      return true;
    });

    // Sort
    filtered.sort((a,b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'amount') { av = +av; bv = +bv; }
      else { av = String(av).toLowerCase(); bv = String(bv).toLowerCase(); }
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });

    // Stats
    const total = expenses.reduce((s,e) => s + e.amount, 0);
    const prefix = new Date().toISOString().slice(0,7);
    const monthTotal = expenses.filter(e => e.date.startsWith(prefix)).reduce((s,e) => s + e.amount, 0);
    
    $('#totalAmount').textContent = formatCurrency(total);
    $('#thisMonth').textContent = formatCurrency(monthTotal);
    $('#totalCount').textContent = expenses.length;
    $('#selectedCount').textContent = selectedIds.size;
    $('#bulkBar').classList.toggle('hidden', selectedIds.size === 0);

    // Category Dropdown
    const cats = [...new Set(expenses.map(e => e.category))].sort();
    const curCat = $('#categoryFilter').value;
    $('#categoryFilter').innerHTML = '<option value="">All Categories</option>' + cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    if (cats.includes(curCat)) $('#categoryFilter').value = curCat;
    $('#categoryOptions').innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">`).join('');

    // Table
    $('#emptyMessage').classList.toggle('hidden', filtered.length > 0);
    tbody.innerHTML = filtered.map(e => {
      const sel = selectedIds.has(e.id);
      const cls = e.amount < 0 ? 'negative' : 'positive';
      return `<tr>
        <td><input type="checkbox" class="row-select" data-id="${e.id}" ${sel?'checked':''} style="width:auto;"></td>
        <td>${e.date}</td>
        <td>${escapeHtml(e.description)} ${e.recurring ? '🔁' : ''}</td>
        <td><span class="cat-badge">${escapeHtml(e.category)}</span></td>
        <td class="amount ${cls}" style="text-align:right;">${formatCurrency(e.amount)}</td>
        <td><button class="btn-icon" style="padding:0.3rem;" data-del="${e.id}" style="color:var(--danger);">🗑</button></td>
      </tr>`;
    }).join('');

    $('#selectAllCheckbox').checked = filtered.length > 0 && filtered.every(e => selectedIds.has(e.id));
  }

  // === Modals ===
  function openExpenseModal(id = null) {
    editingId = id;
    const e = id ? expenses.find(x => x.id === id) : null;
    $('#expenseModalTitle').textContent = e ? 'Edit Expense' : 'Add Expense';
    $('#modalAmount').value = e ? e.amount : '';
    $('#modalDescription').value = e ? e.description : '';
    $('#modalCategory').value = e ? e.category : '';
    $('#modalDate').value = e ? e.date : todayISO();
    $('#modalRecurring').checked = e ? e.recurring : false;
    $('#expenseModal').classList.add('open');
    setTimeout(() => $('#modalAmount').focus(), 100);
  }

  function saveExpense() {
    const amount = parseFloat($('#modalAmount').value);
    const date = $('#modalDate').value;
    if (isNaN(amount) || !isValidDate(date)) return toast('Invalid amount or date');
    
    const data = {
      amount,
      date,
      description: $('#modalDescription').value.trim() || '—',
      category: $('#modalCategory').value.trim() || 'Other',
      recurring: $('#modalRecurring').checked
    };

    if (editingId) {
      expenses = expenses.map(x => x.id === editingId ? { ...x, ...data } : x);
    } else {
      expenses.push({ id: uid(), ...data });
    }
    
    save(); render();
    $('#expenseModal').classList.remove('open');
    toast('Saved!');
  }

  // === Import / Export ===
  function handleFile(file) {
    const r = new FileReader();
    r.onload = e => {
      pendingImport = parseCSV(e.target.result);
      if (!pendingImport.length) return toast('No valid data found');
      $('#importSummary').textContent = `Found ${pendingImport.length} rows.`;
      $('#importModal').classList.add('open');
    };
    r.readAsText(file);
  }

  function exportCSV() {
    if (!expenses.length) return toast('Nothing to export');
    const head = 'date,description,category,amount,recurring\n';
    const body = expenses.map(e => `${e.date},"${e.description.replace(/"/g,'""')}","${e.category}",${e.amount},${e.recurring}`).join('\n');
    const blob = new Blob([head+body], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `safespend_${todayISO()}.csv`;
    a.click();
    toast('Exported!');
  }

  // === Events ===
  function init() {
    load();
    $('#currencySelect').value = currency;
    
    // Theme
    const savedTheme = localStorage.getItem(THEME_KEY) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', savedTheme);
    $('#themeToggle').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    $('#themeToggle').onclick = () => {
      const nt = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nt);
      localStorage.setItem(THEME_KEY, nt);
      $('#themeToggle').textContent = nt === 'dark' ? '☀️' : '🌙';
    };

    // Currency
    $('#currencySelect').onchange = (e) => {
      currency = e.target.value;
      save(); render();
    };

    // Add / Edit
    $('#addBtn').onclick = () => openExpenseModal();
    $('#modalSave').onclick = saveExpense;
    $('#modalCancel').onclick = () => $('#expenseModal').classList.remove('open');

    // Bulk Actions
    $('#bulkDeleteBtn').onclick = () => {
      if (confirm(`Delete ${selectedIds.size} items?`)) {
        expenses = expenses.filter(e => !selectedIds.has(e.id));
        selectedIds.clear(); save(); render();
      }
    };
    $('#bulkCategoryBtn').onclick = () => {
      $('#bulkCategoryModal').classList.add('open');
    };
    $('#bulkCategorySave').onclick = () => {
      const c = $('#bulkCategoryInput').value.trim();
      if (c) {
        expenses = expenses.map(e => selectedIds.has(e.id) ? { ...e, category: c } : e);
        save(); render();
      }
      $('#bulkCategoryModal').classList.remove('open');
    };
    $('#bulkCategoryCancel').onclick = () => $('#bulkCategoryModal').classList.remove('open');

    // Table Actions
    tbody.onclick = (e) => {
      const del = e.target.closest('[data-del]');
      if (del) {
        if (confirm('Delete this expense?')) {
          expenses = expenses.filter(x => x.id !== del.dataset.del);
          save(); render();
        }
        return;
      }
      const cb = e.target.closest('.row-select');
      if (cb) {
        const id = cb.dataset.id;
        if (cb.checked) selectedIds.add(id); else selectedIds.delete(id);
        render();
      }
    };

    // Select All
    $('#selectAllCheckbox').onchange = (e) => {
      const checked = e.target.checked;
      const filtered = expenses.filter(x => !$('#searchInput').value || x.description.toLowerCase().includes($('#searchInput').value.toLowerCase()));
      if (checked) filtered.forEach(x => selectedIds.add(x.id));
      else selectedIds.clear();
      render();
    };

    // Sorting
    document.querySelectorAll('th[data-sort]').forEach(th => {
      th.onclick = () => {
        const key = th.dataset.sort;
        if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        else { sortKey = key; sortDir = 'desc'; }
        render();
      };
    });

    // Search & Filter
    $('#searchInput').oninput = render;
    $('#categoryFilter').onchange = render;
    $('#dateFrom').onchange = render;
    $('#dateTo').onchange = render;

    // Load / Clear
    $('#loadSampleBtn').onclick = () => {
      expenses.push(
        { id: uid(), date: todayISO(), amount: 450.00, description: 'Groceries', category: 'Food' },
        { id: uid(), date: todayISO(), amount: 125.50, description: 'Fuel', category: 'Transport' },
        { id: uid(), date: todayISO(), amount: -50.00, description: 'Refund', category: 'Other' }
      );
      save(); render(); toast('Sample loaded');
    };
    $('#clearAllBtn').onclick = () => {
      if (confirm('Delete EVERYTHING?')) { expenses = []; save(); render(); }
    };

    // Import / Export
    $('#csvFileInput').onchange = (e) => handleFile(e.target.files[0]);
    $('#exportBtn').onclick = exportCSV;
    $('#importConfirm').onclick = () => {
      const mode = document.querySelector('input[name="importMode"]:checked').value;
      if (mode === 'replace') expenses = [...pendingImport];
      else expenses = [...expenses, ...pendingImport];
      save(); render();
      $('#importModal').classList.remove('open');
      pendingImport = [];
      toast('Imported!');
    };
    $('#importCancel').onclick = () => { $('#importModal').classList.remove('open'); pendingImport = []; };

    // Init render
    render();
  }

  init();
})();
</script>
</body>
</html>
